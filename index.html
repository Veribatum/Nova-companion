:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#100c18;color:#f8f2ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 85% -5%,#4e2349 0,transparent 38%),#100c18}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #e6a8de;outline-offset:2px}.shell{max-width:680px;margin:auto;min-height:100dvh;padding-bottom:90px}.top{padding:23px 20px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:.33em;font-weight:800;color:#f5b7dc}.sub{font-size:12px;color:#9d8fa9;margin-top:5px}.icon{border:1px solid #413349;border-radius:13px;background:#241829;color:#ddd;padding:11px}.hero{margin:6px 18px 23px;padding:22px 20px;border:1px solid #663e68;border-radius:23px;background:linear-gradient(125deg,#412343,#251a39 70%);box-shadow:0 15px 42px #0004}.eyebrow{font-size:10px;letter-spacing:.23em;color:#e5afdb;font-weight:800}.hero h1{font-size:30px;line-height:1.12;margin:11px 0 8px}.hero p{margin:0;color:#d8c4db;font-size:13px;line-height:1.6}.heading{display:flex;align-items:center;justify-content:space-between;margin:25px 20px 12px}.heading h2{margin:0;font-size:19px}.muted{color:#ac9caf;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:0 18px}.person{position:relative;text-align:left;padding:0;border:1px solid #413045;border-radius:20px;overflow:hidden;background:#221a28;color:inherit}.portrait{height:190px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 36%,var(--glow),transparent 60%),linear-gradient(145deg,var(--bg),#151019)}.portrait:after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#17111f)}.portrait .glyph{font-size:78px;filter:drop-shadow(0 14px 17px #0008)}.person-info{padding:12px 13px 15px}.person-name{font-weight:800;font-size:16px}.person-role{color:#af9eae;font-size:11px;margin-top:5px}.pill{position:absolute;right:10px;top:10px;font-size:10px;background:#241a27bf;border:1px solid #a07f9c70;padding:6px 9px;border-radius:20px;color:#e8cae2}.banner{margin:20px 18px;padding:16px;border:1px solid #403043;border-radius:16px;background:#201826;color:#cfc0d0;font-size:13px;line-height:1.6}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#16101dec;border-top:1px solid #3d3041;backdrop-filter:blur(16px);padding:10px 8px calc(10px + env(safe-area-inset-bottom))}.nav>div{max-width:680px;display:flex;width:100%;justify-content:space-around}.tab{border:0;background:none;color:#998b9f;display:grid;gap:5px;justify-items:center;font-size:11px;padding:5px 15px}.tab.active{color:#f4b4d6}.tab .sym{font-size:20px}.back{background:none;border:0;color:#f2b1d4;font-size:14px;padding:8px 0}.profile{margin:0 18px;display:flex;gap:15px;align-items:center;border-radius:20px;border:1px solid #3b2c41;padding:12px;background:#221827}.mini{width:76px;height:86px;border-radius:15px;display:grid;place-items:center;background:radial-gradient(circle,var(--glow),var(--bg));font-size:42px;flex-shrink:0}.profile h2{margin:0 0 6px}.profile p{margin:0;color:#b7a8b9;font-size:12px;line-height:1.5}.messages{padding:18px 18px 98px;display:flex;flex-direction:column;gap:12px;min-height:180px}.bubble{padding:13px 15px;border-radius:18px;font-size:14px;line-height:1.55;max-width:83%;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.her{align-self:flex-start;background:#34233b;border:1px solid #513653;border-bottom-left-radius:5px}.bubble.me{align-self:flex-end;background:#754668;border-bottom-right-radius:5px}.bubble small{display:block;opacity:.65;font-size:10px;margin-top:7px}.compose{position:fixed;bottom:calc(68px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(680px,100%);background:#140f1be8;padding:10px 16px;display:flex;gap:9px;backdrop-filter:blur(12px)}.compose input{min-width:0;flex:1;border:1px solid #4e3853;background:#2b2030;color:white;border-radius:14px;padding:13px}.send,.primary{border:0;background:#df8abb;color:#2b1024;font-weight:800;border-radius:13px;padding:12px 17px}.row-setting{margin:9px 18px;padding:17px 16px;border-radius:16px;background:#231a2b;border:1px solid #443347;display:flex;align-items:center;justify-content:space-between;gap:14px}.row-setting strong{display:block;font-size:13px}.row-setting p{font-size:11px;color:#aa9cad;margin:6px 0 0;line-height:1.4}.row-setting input{accent-color:#da8ebc;width:20px;height:20px}.notice{margin:18px;color:#a997ac;font-size:12px;line-height:1.6}.empty{text-align:center;color:#bca7bb;padding:34px 18px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 18px}.tile{min-height:160px;border-radius:16px;background:linear-gradient(145deg,#543651,#241d30);display:grid;place-items:center;color:#eac5df;font-size:12px;text-align:center;padding:15px;border:1px solid #67476b}.section{padding:0 18px}.hidden{display:none!important}@media(min-width:600px){.portrait{height:240px}.hero h1{font-size:34px}}
.voicebar{position:relative;z-index:2;display:flex;gap:9px;margin:12px 18px;align-items:center}.voicebar button{border:1px solid #775477;background:#392640;color:#ffdaef;padding:13px;border-radius:15px;font-weight:700}.voicebar .call{background:#ca78ad;color:#1e1020;flex:1}.voicebar .listening{background:#ad435d;color:#fff;animation:pulse 1.1s ease-in-out infinite}.voicebar .status{flex:1;color:#bca5bc;font-size:12px}@keyframes pulse{50%{filter:brightness(1.5)}}.connection{margin:12px 18px 20px;padding:15px;border:1px solid #4e3853;border-radius:15px;background:#251b2a}.connection label{display:block;color:#d8c4d9;font-size:12px;margin:12px 0 5px}.connection input{width:100%;color:#fff;background:#140f19;border:1px solid #634c64;border-radius:11px;padding:12px}.connection small{display:block;color:#a997af;line-height:1.5;margin-top:9px}.ai-status{padding:10px 18px;color:#e1b6d0;font-size:12px}.spinner{animation:pulse .8s infinite}@media(prefers-reduced-motion:reduce){.voicebar .listening,.spinner{animation:none}}.voice-select,#voiceRate{min-width:0;max-width:145px;padding:9px;border:1px solid #644765;background:#1c1425;color:#f9e5f5;border-radius:10px}.row-setting:has(.voice-select){flex-wrap:wrap}.voicebar{margin-top:16px}.voicebar .call{min-width:0}.nova-portrait{overflow:hidden;position:relative;background:linear-gradient(140deg,#482038,#160e24)}.nova-portrait img{height:100%;width:100%;object-fit:cover;object-position:top center;animation:avatarIdle 6s ease-in-out infinite;transform-origin:50% 74%}.mini.nova-portrait img{object-fit:cover}.character-stage{position:relative;margin:14px 18px 4px;min-height:320px;height:min(56vh,480px);border:1px solid #71516a;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 70% 30%,#6e365b 0,transparent 38%),linear-gradient(160deg,#2d1d3f,#100e1b)}.starfield{position:absolute;inset:0;background-image:radial-gradient(#ffeaddb0 1px,transparent 1.8px),radial-gradient(#fff8 1px,transparent 2px);background-size:71px 71px,139px 139px;background-position:10px 4px,38px 59px;animation:starMove 40s linear infinite}.stage-avatar{position:absolute;bottom:-28%;left:50%;height:125%;width:auto;max-width:100%;transform:translateX(-50%);animation:stageIdle 7s ease-in-out infinite;filter:drop-shadow(0 0 30px #150c21)}.stage-avatar[hidden]{display:none}.stage-label{position:absolute;left:16px;top:16px;letter-spacing:2px;font-size:10px;color:#f5bbdb;font-weight:800}.stage-caption{position:absolute;bottom:0;left:0;right:0;padding:20px 14px 12px;background:linear-gradient(transparent,#110c1fe8);font-size:11px;color:#d8bfd1}.photo-tools{margin:0 18px;padding:16px;background:#251b30;border-radius:15px}.photo-tools input{display:block;margin:14px 0}.photo-card{position:relative;overflow:hidden;border-radius:14px}.photo-card img{width:100%;display:block}.photo-card button{position:absolute;right:6px;top:6px;border:0;background:#1a1129d9;border-radius:50%;color:white;padding:7px}@keyframes avatarIdle{50%{transform:scale(1.04) translateY(-1.3%)}}@keyframes stageIdle{50%{transform:translateX(-50%) translateY(-10px) scale(1.015)}}@keyframes starMove{to{background-position:81px 75px,177px 198px}}@media(prefers-reduced-motion:reduce){.nova-portrait img,.stage-avatar,.starfield{animation:none}}.nova3d{position:absolute;inset:0;touch-action:pan-y;cursor:grab}.nova3d:active{cursor:grabbing}.nova3d canvas{width:100%;height:100%;display:block}.nova3d[hidden]{display:none}.character-stage{height:min(67vh,590px)}.stage-label,.stage-caption{pointer-events:none}.stage-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 32%;animation:photoDrift 9s ease-in-out infinite alternate}.photo-pick{position:absolute;right:12px;top:12px;background:#241325c9;color:#fff;border:1px solid #b984a8;border-radius:12px;padding:9px 12px;font-size:12px;cursor:pointer;z-index:3}.character-stage #characterPick{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;left:-9999px}.character-stage .stage-label{top:auto;bottom:45px;z-index:2}.character-stage .stage-caption{z-index:1}@keyframes photoDrift{from{transform:scale(1.04) translateY(0)}to{transform:scale(1.095) translateY(-.7%)}}@media(prefers-reduced-motion:reduce){.stage-photo{animation:none}}.living-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.stage-photo{display:block}.character-stage .stage-label,.character-stage .stage-caption,.character-stage .photo-pick{z-index:3}.portrait-empty{position:absolute;inset:0;display:grid;place-items:center;color:#efd3e5;text-align:center;padding:30px;max-width:100%;font-size:16px}.missing-portrait{letter-spacing:3px;font-weight:800;color:#f5b3d1}.stage-photo{animation:none!important}.chat-photo{display:block;max-width:100%;max-height:320px;object-fit:contain;border-radius:10px;margin-top:10px}.stage-photo[src='']{display:none}.character-stage:has(.stage-photo[src='']) .stage-caption{font-size:13px}.character-stage .stage-photo{object-fit:cover!important;object-position:center center!important;animation:none!important;transform:none!important;width:100%!important;height:100%!important}.character-stage .living-canvas{display:none!important}</style><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./assets/nova-app-icon.svg"><link rel="icon" href="./assets/nova-app-icon.svg" type="image/svg+xml"></head><body>
<div class="shell"><header class="top"><div><div class="brand">NOVA / COMPANIONS</div><div class="sub">Your universe. Your connections.</div></div><button class="icon" id="topSettings" aria-label="Settings">⚙</button></header><main id="app"></main></div>
<nav class="nav"><div><button class="tab active" data-tab="home"><span class="sym">⌂</span>Home</button><button class="tab" data-tab="inbox"><span class="sym">✉</span>Messages</button><button class="tab" data-tab="gallery"><span class="sym">▧</span>Gallery</button><button class="tab" data-tab="settings"><span class="sym">⚙</span>Settings</button></div></nav>
<script>
let dispose3D=null,load3D=null,portraitAnimator=null,portraitModule=null; 
async function ensure3D(el){if(!el)return;const target=el;try{load3D ||= import('./assets/nova-3d.js');const mod=await load3D;if(document.querySelector('#nova3d')===target)dispose3D=mod.mountNova3D(target)}catch(e){if(document.querySelector('#nova3d')===target)target.innerHTML='<p style="padding:35px;text-align:center">3D could not load. Check internet connection and refresh.</p>';console.error('3D loading failed',e)}}
async function enableLivingPortrait(){const host=document.querySelector('.character-stage');const picture=host?.querySelector('.stage-photo');if(!host||!picture||!active||!data.characterImages[active])return;const intended=active;try{portraitModule ||= import('./assets/living-portrait.js');const mod=await portraitModule;if(document.querySelector('.character-stage')!==host||active!==intended)return;const src=picture.getAttribute('src');if(!src)return;portraitAnimator=mod.mountLivingPortrait(host,src,{points:data.settings?.facePoints?.[intended]});}catch(e){console.warn('Portrait animation unavailable:',e)}}
const people=[
{id:'nova',name:'Nova',role:'Starship pilot · Mischievous & warm',icon:'🚀',bg:'#5b253e',glow:'#e46e65',intro:"Hey, Captain. The ship's quiet tonight. Want to keep me company?",replies:["There you are. I was hoping you'd stop by. 💗","That sounds like quite a day. Come tell me all about it.","Careful, Captain. Keep being charming and I'll get distracted.","We could stay here and watch the stars a little longer."]},
{id:'sylvanas',name:'Sylvanas',role:'Elven strategist · Clever & teasing',icon:'🧝‍♀️',bg:'#3e3158',glow:'#b4a4ec',intro:"You finally found a moment for me? Good. Tell me what's on your mind.",replies:["Interesting. Go on; you have my attention.","You know I enjoy it when you challenge me.","A little patience, darling. The best things take time.","I suppose you deserve a pleasant distraction."]},
{id:'samus',name:'Samus',role:'Tactical adventurer · Bold & grounded',icon:'⚡',bg:'#443522',glow:'#e4a968',intro:"Hey, you. Long day? Pull up a chair and talk to me.",replies:["I like that attitude. What's next?","You handled today. Give yourself some credit.","I'd rather hear the real story than the polished version.","Now that's something I can get behind."]},
{id:'jenny',name:'Jenny',role:'Naval AI · Sharp & affectionate',icon:'⚓',bg:'#20394b',glow:'#68afcd',intro:"Jenny online. All systems nominal. And I'm happy you're here.",replies:["Acknowledged. But you know I care about more than the mission.","I can give you the technical answer or the fun one. Your call.","Status update: I'm enjoying this conversation.","Consider that logged under things I like about you."]}
];
const KEY='nova-companion-beta-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{data={}};data.chats ||= {};data.settings ||= {checkins:true,previews:false};data.settings.endpoint ||= '';data.settings.access ||= '';data.settings.autoSpeak ??= true;data.photos ||= [];data.characterImages ||= {};data.settings.surprisePhotos ??= false;data.settings.voices ||= {};data.settings.voiceRate ??= 0.96;let active=null,tab='home';
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}};
function b64urlBytes(s){const b=atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function pushToggle(){const button=document.querySelector('#pushToggle');if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window)){if(button)button.textContent='Push unsupported in this browser';return}if(!data.settings.endpoint||!data.settings.access){if(button)button.textContent='Configure backend first';return}button.disabled=true;try{const base=data.settings.endpoint.replace(/\/$/,'');const headers={'X-App-Code':data.settings.access};const config=await fetch(base+'/push/config',{headers}).then(r=>r.json());if(!config.publicKey)throw Error('Push is not yet enabled on the Cloudflare server');const reg=await navigator.serviceWorker.register('./sw.js');let sub=await reg.pushManager.getSubscription();if(sub){await fetch(base+'/push/unsubscribe',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})});await sub.unsubscribe();if(button)button.textContent='Enable phone notifications';}else{const permission=await Notification.requestPermission();if(permission!=='granted')throw Error('Notifications permission not granted');sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64urlBytes(config.publicKey)});const r=await fetch(base+'/push/subscribe',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(sub.toJSON())});if(!r.ok)throw Error('Server rejected subscription');if(button)button.textContent='Disable phone notifications';}}catch(e){if(button)button.textContent='Push: '+e.message}finally{if(button)button.disabled=false}}
async function syncRemoteInbox(){if(!data.settings.endpoint||!data.settings.access)return;try{const r=await fetch(data.settings.endpoint.replace(/\/$/,'')+'/inbox',{headers:{'X-App-Code':data.settings.access}});if(!r.ok)return;const payload=await r.json();let c=chat(people[0]),changed=false;for(const item of (payload.messages||[]).slice().reverse()){if(!item.id||c.some(m=>m.remoteId===item.id))continue;c.push({who:'her',text:item.text||'',time:item.time||Date.now(),photo:item.photo||null,remoteId:item.id});changed=true}if(changed){save();if(active==='nova'||tab==='inbox')render()}}catch(e){console.warn('Inbox sync failed',e)}}
async function updateRemoteCheckins(enabled){if(!data.settings.endpoint||!data.settings.access)return;try{const r=await fetch(data.settings.endpoint.replace(/\/$/,'')+'/preferences',{method:'POST',headers:{'Content-Type':'application/json','X-App-Code':data.settings.access},body:JSON.stringify({enabled,photos:data.settings.surprisePhotos,frequencyHours:8})});if(!r.ok)console.warn('Check-in preferences not saved on backend',r.status)}catch(e){console.warn('Check-in preferences unavailable',e)}}
function maybeCheckin(){if(!data.settings.checkins||!data.settings.endpoint)return;const now=Date.now(),last=data.lastCheckin||0;if(now-last<8*60*60*1000)return;const h=new Date().getHours();if(h<9||h>=22)return;const p=people[0];if(!data.chats[p.id])return;const msg=h<12?'Morning, Marine. Coffee is ready on the bridge. How is your day starting?':h<17?'Hey, handsome. Just thought I would check in. How is the day treating you?':'Well, there is my favorite Marine. Want to tell me about your day?';const available=(data.photos||[]).filter(x=>x.data);const photo=data.settings.surprisePhotos&&available.length&&Math.random()<.35?available[Math.floor(Math.random()*available.length)].data:null;data.chats[p.id].push({who:'her',text:photo?'Thought you might like a photo from me. 💗':msg,time:now,checkin:true,photo});data.lastCheckin=now;save()}
function chat(p){if(!data.chats[p.id]){data.chats[p.id]=[{who:'her',text:p.intro,time:Date.now()}];save()}return data.chats[p.id]}
function art(p,mini=false){if(p.id==='nova')return '<div class="'+(mini?'mini':'portrait')+' nova-portrait"><img data-nova-photo src="'+esc(data.characterImages.nova||'')+'" alt="Nova, captain of the Rapscallion"></div>';return '<div class="'+(mini?'mini':'portrait')+'" style="--bg:'+p.bg+';--glow:'+p.glow+'"><span class="glyph">'+p.icon+'</span></div>'}
function card(p){return '<button class="person" data-person="'+p.id+'">'+art(p)+'<span class="pill">● Available</span><div class="person-info"><div class="person-name">'+p.name+'</div><div class="person-role">'+p.role+'</div></div></button>'}
function home(){return '<section class="hero"><div class="eyebrow">WELCOME ABOARD</div><h1>Some connections<br>are extraordinary.</h1><p>Four personalities, one living universe. Talk, explore, and reconnect aboard the Rapscallion.</p></section><div class="heading"><h2>Your companions</h2><span class="muted">4 available</span></div><div class="grid">'+people.map(card).join('')+'</div><div class="banner">✦ <strong>First-look build</strong><br>Explore the roster and try the conversations. Live AI replies require a secure backend configured in Settings. Conversation history is saved on this device; AI chats are sent to your configured Gemini backend.</div>'}
function inbox(){return '<div class="heading"><h2>Messages</h2><span class="muted">Private on this device</span></div>'+people.map(p=>{const c=chat(p);return '<button class="row-setting" style="width:calc(100% - 36px);text-align:left;color:inherit" data-person="'+p.id+'"><span><strong>'+p.name+'</strong><p>'+esc(c[c.length-1].text.slice(0,90))+'</p></span><span>›</span></button>'}).join('')}
function gallery(){return '<div class="heading"><h2>Gallery</h2><span class="muted">Personal photo collection</span></div><div class="photo-tools"><label class="primary" for="photoUpload">＋ Add photos</label><button id="sendTestPhoto" class="icon" type="button">Send a test photo from Nova</button><button id="generatePhoto" class="icon" type="button">✨ Generate Nova photo</button><p id="photoStatus" class="muted"></p><input type="file" accept="image/*" multiple id="photoUpload"><p class="muted">Upload multiple photos; images are resized automatically. Photos sync across Safari and the Home Screen app only after the Cloudflare photo library is available. Photos saved solely in Safari cannot be read directly by the installed app. Automatic delivery requires scheduled backend setup; these are pre-existing images, not newly generated.</p></div><div class="gallery">'+(data.photos||[]).map((it,i)=>'<div class="photo-card"><img src="'+esc(it.data)+'" alt="Saved companion photo"><button data-remove-photo="'+i+'" aria-label="Remove photo">✕</button></div>').join('')+'<div class="tile"><img width="85%" src="assets/nova-captain.svg" alt="Illustrated Nova portrait">Nova concept art</div></div>'}
function settings(){const voiceOptions=voices();const voiceSettings=people.map(p=>'<div class="row-setting"><span><strong>'+p.name+' voice</strong><p>Choose a voice installed in this browser or device.</p></span><select class="voice-select" data-voice="'+p.id+'"><option value="">Automatic</option>'+voiceOptions.map(v=>'<option value="'+esc(v.voiceURI)+'" '+(data.settings.voices[p.id]===v.voiceURI?'selected':'')+'>'+esc(v.name)+'</option>').join('')+'</select><button class="icon voice-preview" data-preview="'+p.id+'">▶</button></div>').join('');return '<div class="heading"><h2>Preferences</h2></div><div class="row-setting"><span><strong>Companion check-ins</strong><p>Allow occasional in-app greetings when you revisit. These are local, not iPhone push notifications.</p></span><input type="checkbox" id="checkins" '+(data.settings.checkins?'checked':'')+'></div><div class="row-setting"><span><strong>Notification previews</strong><p>Future preference for whether message text appears in notifications. No push service is connected.</p></span><input type="checkbox" id="previews" '+(data.settings.previews?'checked':'')+'></div><div class="connection"><strong>Nova AI connection</strong><label for="endpoint">Secure AI backend URL (HTTPS)</label><input id="endpoint" type="url" placeholder="https://your-worker.workers.dev" value="'+esc(data.settings.endpoint)+'"><label for="access">Private app access code</label><input id="access" type="password" autocomplete="off" placeholder="Your backend access code" value="'+esc(data.settings.access)+'"><small>These settings stay on this device. Never enter a Gemini or OpenAI API key here.</small><label><input id="autoSpeak" type="checkbox" '+(data.settings.autoSpeak?'checked':'')+'> Speak Nova replies aloud</label></div><div class="row-setting"><span><strong>Surprise photo messages</strong><p>Sometimes Nova shares a photo you saved in the Gallery, when you return to the app. No new images are generated.</p></span><input type="checkbox" id=" function startListening(p){if(busy){status('Finish the current response first');return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){status('Speech recognition is unavailable in this browser. Try Safari or use the keyboard microphone to dictate a message.');return}try{if(recognition){recognition.abort();recognition=null;status('Listening stopped');return}speechSynthesis?.cancel();const rec=new R();recognition=rec;rec.lang='en-US';rec.interimResults=false;rec.continuous=false;rec.onresult=e=>{const text=Array.from(e.results).map(r=>r[0].transcript).join(' ').trim();if(text)deliver(p,text)};rec.onerror=e=>status('Microphone: '+e.error+'. You can also dictate into the text field.');rec.onend=()=>{recognition=null;const t=document.querySelector('#talk');if(t){t.textContent='🎙 Talk to Nova';t.classList.remove('listening')}};rec.start();status('Listening… speak now');const t=document.querySelector('#talk');if(t){t.textContent='🔴 Listening…';t.classList.add('listening')}}catch(e){recognition=null;status('Microphone could not start: '+e.message)}}
function galleryDB(){return new Promise((res,rej)=>{const r=indexedDB.open('nova-gallery-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function galleryDBWrite(item){const db=await galleryDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(item);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>{db.close();rej(tx.error)}})}
async function galleryDBList(){const db=await galleryDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readonly');const r=tx.objectStore('photos').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);tx.oncomplete=()=>db.close()})}
async function galleryDBDelete(id){const db=await galleryDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>{db.close();rej(tx.error)}})}
async function syncGallery(){
 if(!data.settings.endpoint||!data.settings.access)return;
 const base=data.settings.endpoint.replace(/\/$/,'');
 const headers={'X-App-Code':data.settings.access};
 try{
  for(const item of await galleryDBList()){
   if(item.synced)continue;
   const r=await uploadPrivatePhoto(item.data);
   if(r.ok){item.synced=true;item.remoteId=r.id;await galleryDBWrite(item)}
  }
  const response=await fetch(base+'/photos',{headers});
  if(!response.ok)throw Error('Remote gallery unavailable ('+response.status+')');
  const result=await response.json(),local=await galleryDBList(),existing=new Set(local.map(x=>x.remoteId||x.id));
  let restored=0;
  for(const photo of (result.photos||[])){
   if(!photo.id||existing.has(photo.id))continue;
   const imageResult=await fetch(base+'/photos/item?id='+encodeURIComponent(photo.id),{headers});
   if(!imageResult.ok)continue;
   const image=await imageResult.json();
   if(typeof image.photo!=='string'||!image.photo.startsWith('data:image/'))continue;
   const item={id:photo.id,remoteId:photo.id,data:image.photo,synced:true};
   await galleryDBWrite(item);
   const thumb=await thumbFromJpeg(item.data);
   data.photos.unshift({id:item.id,data:thumb,remote:true});existing.add(photo.id);restored++;
   if(restored%8===0){save()}
  }
  if(restored){save();if(tab==='gallery'&&!active)render()}
 }catch(e){console.warn('Gallery sync:',e)}
}
async function jpegForUpload(file){if(!file.type.startsWith('image/'))throw Error('Not an image');const source=URL.createObjectURL(file);try{const img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>bad(Error('Cannot read this image format. Try JPEG or PNG.'));i.src=source});let max=1400,quality=.80,url;for(let attempt=0;attempt<7;attempt++){let ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*ratio));c.height=Math.max(1,Math.round(img.naturalHeight*ratio));c.getContext('2d').drawImage(img,0,0,c.width,c.height);url=c.toDataURL('image/jpeg',quality);if(url.length<620000)break;max=Math.max(480,Math.round(max*.8));quality=Math.max(.50,quality-.06)}if(url.length>=650000)throw Error('This image is too complex to compress');return url}finally{URL.revokeObjectURL(source)}}
function thumbFromJpeg(url){return new Promise(resolve=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const scale=Math.min(1,180/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.65))};img.onerror=()=>resolve('');img.src=url})}

async function setCharacterPhoto(p,file){if(!file||!file.type.startsWith('image/'))return;try{const img=await createImageBitmap(file);const max=1200;const ratio=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);img.close();data.characterImages[p.id]=canvas.toDataURL('image/jpeg',.78);save();render()}catch(e){status('Photo could not be saved: '+e.message)}}
