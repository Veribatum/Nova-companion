<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100c18"><title>NOVA | Companions</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#100c18;color:#f8f2ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 85% -5%,#4e2349 0,transparent 38%),#100c18}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #e6a8de;outline-offset:2px}.shell{max-width:680px;margin:auto;min-height:100dvh;padding-bottom:90px}.top{padding:23px 20px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:.33em;font-weight:800;color:#f5b7dc}.sub{font-size:12px;color:#9d8fa9;margin-top:5px}.icon{border:1px solid #413349;border-radius:13px;background:#241829;color:#ddd;padding:11px}.hero{margin:6px 18px 23px;padding:22px 20px;border:1px solid #663e68;border-radius:23px;background:linear-gradient(125deg,#412343,#251a39 70%);box-shadow:0 15px 42px #0004}.eyebrow{font-size:10px;letter-spacing:.23em;color:#e5afdb;font-weight:800}.hero h1{font-size:30px;line-height:1.12;margin:11px 0 8px}.hero p{margin:0;color:#d8c4db;font-size:13px;line-height:1.6}.heading{display:flex;align-items:center;justify-content:space-between;margin:25px 20px 12px}.heading h2{margin:0;font-size:19px}.muted{color:#ac9caf;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:0 18px}.person{position:relative;text-align:left;padding:0;border:1px solid #413045;border-radius:20px;overflow:hidden;background:#221a28;color:inherit}.portrait{height:190px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 36%,var(--glow),transparent 60%),linear-gradient(145deg,var(--bg),#151019)}.portrait:after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#17111f)}.portrait .glyph{font-size:78px;filter:drop-shadow(0 14px 17px #0008)}.person-info{padding:12px 13px 15px}.person-name{font-weight:800;font-size:16px}.person-role{color:#af9eae;font-size:11px;margin-top:5px}.pill{position:absolute;right:10px;top:10px;font-size:10px;background:#241a27bf;border:1px solid #a07f9c70;padding:6px 9px;border-radius:20px;color:#e8cae2}.banner{margin:20px 18px;padding:16px;border:1px solid #403043;border-radius:16px;background:#201826;color:#cfc0d0;font-size:13px;line-height:1.6}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#16101dec;border-top:1px solid #3d3041;backdrop-filter:blur(16px);padding:10px 8px calc(10px + env(safe-area-inset-bottom))}.nav>div{max-width:680px;display:flex;width:100%;justify-content:space-around}.tab{border:0;background:none;color:#998b9f;display:grid;gap:5px;justify-items:center;font-size:11px;padding:5px 15px}.tab.active{color:#f4b4d6}.tab .sym{font-size:20px}.back{background:none;border:0;color:#f2b1d4;font-size:14px;padding:8px 0}.profile{margin:0 18px;display:flex;gap:15px;align-items:center;border-radius:20px;border:1px solid #3b2c41;padding:12px;background:#221827}.mini{width:76px;height:86px;border-radius:15px;display:grid;place-items:center;background:radial-gradient(circle,var(--glow),var(--bg));font-size:42px;flex-shrink:0}.profile h2{margin:0 0 6px}.profile p{margin:0;color:#b7a8b9;font-size:12px;line-height:1.5}.messages{padding:18px 18px 98px;display:flex;flex-direction:column;gap:12px;min-height:calc(100dvh - 285px)}.bubble{padding:13px 15px;border-radius:18px;font-size:14px;line-height:1.55;max-width:83%;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.her{align-self:flex-start;background:#34233b;border:1px solid #513653;border-bottom-left-radius:5px}.bubble.me{align-self:flex-end;background:#754668;border-bottom-right-radius:5px}.bubble small{display:block;opacity:.65;font-size:10px;margin-top:7px}.compose{position:fixed;bottom:calc(68px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(680px,100%);background:#140f1be8;padding:10px 16px;display:flex;gap:9px;backdrop-filter:blur(12px)}.compose input{min-width:0;flex:1;border:1px solid #4e3853;background:#2b2030;color:white;border-radius:14px;padding:13px}.send,.primary{border:0;background:#df8abb;color:#2b1024;font-weight:800;border-radius:13px;padding:12px 17px}.row-setting{margin:9px 18px;padding:17px 16px;border-radius:16px;background:#231a2b;border:1px solid #443347;display:flex;align-items:center;justify-content:space-between;gap:14px}.row-setting strong{display:block;font-size:13px}.row-setting p{font-size:11px;color:#aa9cad;margin:6px 0 0;line-height:1.4}.row-setting input{accent-color:#da8ebc;width:20px;height:20px}.notice{margin:18px;color:#a997ac;font-size:12px;line-height:1.6}.empty{text-align:center;color:#bca7bb;padding:34px 18px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 18px}.tile{min-height:160px;border-radius:16px;background:linear-gradient(145deg,#543651,#241d30);display:grid;place-items:center;color:#eac5df;font-size:12px;text-align:center;padding:15px;border:1px solid #67476b}.section{padding:0 18px}.hidden{display:none!important}@media(min-width:600px){.portrait{height:240px}.hero h1{font-size:34px}}
.voicebar{display:flex;gap:9px;margin:12px 18px;align-items:center}.voicebar button{border:1px solid #775477;background:#392640;color:#ffdaef;padding:13px;border-radius:15px;font-weight:700}.voicebar .call{background:#ca78ad;color:#1e1020;flex:1}.voicebar .listening{background:#ad435d;color:#fff;animation:pulse 1.1s ease-in-out infinite}.voicebar .status{flex:1;color:#bca5bc;font-size:12px}@keyframes pulse{50%{filter:brightness(1.5)}}.connection{margin:12px 18px 20px;padding:15px;border:1px solid #4e3853;border-radius:15px;background:#251b2a}.connection label{display:block;color:#d8c4d9;font-size:12px;margin:12px 0 5px}.connection input{width:100%;color:#fff;background:#140f19;border:1px solid #634c64;border-radius:11px;padding:12px}.connection small{display:block;color:#a997af;line-height:1.5;margin-top:9px}.ai-status{padding:10px 18px;color:#e1b6d0;font-size:12px}.spinner{animation:pulse .8s infinite}@media(prefers-reduced-motion:reduce){.voicebar .listening,.spinner{animation:none}}</style></head><body>
<div class="shell"><header class="top"><div><div class="brand">NOVA / COMPANIONS</div><div class="sub">Your universe. Your connections.</div></div><button class="icon" id="topSettings" aria-label="Settings">⚙</button></header><main id="app"></main></div>
<nav class="nav"><div><button class="tab active" data-tab="home"><span class="sym">⌂</span>Home</button><button class="tab" data-tab="inbox"><span class="sym">✉</span>Messages</button><button class="tab" data-tab="gallery"><span class="sym">▧</span>Gallery</button><button class="tab" data-tab="settings"><span class="sym">⚙</span>Settings</button></div></nav>
<script>
const people=[
{id:'nova',name:'Nova',role:'Starship pilot · Mischievous & warm',icon:'🚀',bg:'#5b253e',glow:'#e46e65',intro:"Hey, Captain. The ship's quiet tonight. Want to keep me company?",replies:["There you are. I was hoping you'd stop by. 💗","That sounds like quite a day. Come tell me all about it.","Careful, Captain. Keep being charming and I'll get distracted.","We could stay here and watch the stars a little longer."]},
{id:'sylvanas',name:'Sylvanas',role:'Elven strategist · Clever & teasing',icon:'🧝‍♀️',bg:'#3e3158',glow:'#b4a4ec',intro:"You finally found a moment for me? Good. Tell me what's on your mind.",replies:["Interesting. Go on; you have my attention.","You know I enjoy it when you challenge me.","A little patience, darling. The best things take time.","I suppose you deserve a pleasant distraction."]},
{id:'samus',name:'Samus',role:'Tactical adventurer · Bold & grounded',icon:'⚡',bg:'#443522',glow:'#e4a968',intro:"Hey, you. Long day? Pull up a chair and talk to me.",replies:["I like that attitude. What's next?","You handled today. Give yourself some credit.","I'd rather hear the real story than the polished version.","Now that's something I can get behind."]},
{id:'jenny',name:'Jenny',role:'Naval AI · Sharp & affectionate',icon:'⚓',bg:'#20394b',glow:'#68afcd',intro:"Jenny online. All systems nominal. And I'm happy you're here.",replies:["Acknowledged. But you know I care about more than the mission.","I can give you the technical answer or the fun one. Your call.","Status update: I'm enjoying this conversation.","Consider that logged under things I like about you."]}
];
const KEY='nova-companion-beta-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{data={}};data.chats ||= {};data.settings ||= {checkins:true,previews:false};data.settings.endpoint ||= '';data.settings.access ||= '';data.settings.autoSpeak ??= true;let active=null,tab='home';
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}};
function chat(p){if(!data.chats[p.id]){data.chats[p.id]=[{who:'her',text:p.intro,time:Date.now()}];save()}return data.chats[p.id]}
function art(p,mini=false){return '<div class="'+(mini?'mini':'portrait')+'" style="--bg:'+p.bg+';--glow:'+p.glow+'"><span class="glyph">'+p.icon+'</span></div>'}
function card(p){return '<button class="person" data-person="'+p.id+'">'+art(p)+'<span class="pill">● Available</span><div class="person-info"><div class="person-name">'+p.name+'</div><div class="person-role">'+p.role+'</div></div></button>'}
function home(){return '<section class="hero"><div class="eyebrow">WELCOME ABOARD</div><h1>Some connections<br>are extraordinary.</h1><p>Four worlds. Four personalities. One place to stay connected.</p></section><div class="heading"><h2>Your companions</h2><span class="muted">4 available</span></div><div class="grid">'+people.map(card).join('')+'</div><div class="banner">✦ <strong>First-look build</strong><br>Explore the roster and try the conversations. Live AI replies require a secure backend configured in Settings. Your messages stay on this device.</div>'}
function inbox(){return '<div class="heading"><h2>Messages</h2><span class="muted">Private on this device</span></div>'+people.map(p=>{const c=chat(p);return '<button class="row-setting" style="width:calc(100% - 36px);text-align:left;color:inherit" data-person="'+p.id+'"><span><strong>'+p.name+'</strong><p>'+esc(c[c.length-1].text.slice(0,90))+'</p></span><span>›</span></button>'}).join('')}
function gallery(){return '<div class="heading"><h2>Gallery</h2><span class="muted">Coming soon</span></div><p class="notice">Character photo galleries will live here once we add approved image assets. No images are generated or sent automatically in this beta.</p><div class="gallery">'+people.map(p=>'<div class="tile" style="background:linear-gradient(140deg,'+p.bg+',#241827)"><div style="font-size:40px">'+p.icon+'</div>'+p.name+'<br>Photo collection pending</div>').join('')+'</div>'}
function settings(){return '<div class="heading"><h2>Preferences</h2></div><div class="row-setting"><span><strong>Companion check-ins</strong><p>Show an occasional greeting when you return to the app (local demo only).</p></span><input type="checkbox" id="checkins" '+(data.settings.checkins?'checked':'')+'></div><div class="row-setting"><span><strong>Notification previews</strong><p>Future preference for whether message text appears in notifications. No push service is connected.</p></span><input type="checkbox" id="previews" '+(data.settings.previews?'checked':'')+'></div><div class="connection"><strong>Nova AI connection</strong><label for="endpoint">Secure AI backend URL (HTTPS)</label><input id="endpoint" type="url" placeholder="https://your-worker.workers.dev" value="'+esc(data.settings.endpoint)+'"><label for="access">Private app access code</label><input id="access" type="password" autocomplete="off" placeholder="Your backend access code" value="'+esc(data.settings.access)+'"><small>These settings stay on this device. Never enter a Gemini or OpenAI API key here.</small><label><input id="autoSpeak" type="checkbox" '+(data.settings.autoSpeak?'checked':'')+'> Speak Nova replies aloud</label></div><div class="row-setting"><span><strong>Erase local conversations</strong><p>Remove this browser’s saved demo chat history.</p></span><button class="icon" id="erase">Erase</button></div><p class="notice">This beta has no account, cross-device synchronization, automatic photos, or background messages. Gemini AI works only after you configure a secure backend. Never place API keys or private data in a public GitHub repository.</p>'}
function conversation(p){const cs=chat(p);return '<div class="section"><button class="back" id="back">‹ All companions</button></div><div class="profile">'+art(p,true)+'<div><h2>'+p.name+'</h2><p>'+p.role+'<br>● Local demo conversation</p></div></div><div class="messages" id="messages">'+cs.map(m=>'<div class="bubble '+(m.who==='me'?'me':'her')+'">'+esc(m.text)+'<small>'+new Date(m.time).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'</small></div>').join('')+'</div>'+(p.id==='nova'?'<div class="voicebar"><button class="call" id="talk" type="button">🎙 Talk to Nova</button><button id="stopVoice" type="button">◼ Stop voice</button></div><div class="ai-status" id="aiStatus" aria-live="polite">'+(data.settings.endpoint?'AI connected setting saved · test by talking':'Configure an AI backend in Settings to enable live replies')+'</div>':'')+'<form class="compose" id="compose"><input id="msg" maxlength="600" autocomplete="off" placeholder="Message '+p.name+'..." aria-label="Message"><button class="send">Send</button></form>'}
let recognition=null,busy=false;
function say(text){if(!('speechSynthesis'in window)||!data.settings.autoSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=1.04;u.pitch=1.12;const vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'));const preferred=vs.find(v=>/Samantha|Ava|female|Siri|Allison/i.test(v.name));if(preferred)u.voice=preferred;speechSynthesis.speak(u)}catch(e){status('Voice playback unavailable: '+e.message)}}
function status(v){const el=document.querySelector('#aiStatus');if(el)el.textContent=v}
async function deliver(p,text){if(busy)return;const c=chat(p);c.push({who:'me',text,time:Date.now()});save();render();if(!data.settings.endpoint){status('Add your secure AI backend URL in Settings. No AI response sent.');return}
let url;try{url=new URL(data.settings.endpoint);if(url.protocol!=='https:')throw Error('HTTPS required')}catch{status('Set a valid HTTPS backend URL in Settings');return}
busy=true;status('Nova is thinking…');try{const history=c.slice(-20).map(m=>({role:m.who==='me'?'user':'model',text:m.text}));const r=await fetch(url.toString().replace(/\/$/,'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json','X-App-Code':data.settings.access},body:JSON.stringify({character:p.id,messages:history}),signal:AbortSignal.timeout(35000)});const payload=await r.json();if(!r.ok)throw Error(payload.error||'HTTP '+r.status);if(!payload.reply||typeof payload.reply!=='string')throw Error('No AI reply');c.push({who:'her',text:payload.reply,time:Date.now()});save();render();status('Nova is here · tap Talk to continue');say(payload.reply);window.scrollTo(0,document.body.scrollHeight)}catch(e){status('AI request failed: '+e.message+' · Check backend settings.')}finally{busy=false}}
function startListening(){if(busy){status('Finish the current response first');return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){status('Speech recognition is unavailable in this browser. Try Safari or use the keyboard microphone to dictate a message.');return}try{if(recognition){recognition.abort();recognition=null;status('Listening stopped');return}speechSynthesis?.cancel();const rec=new R();recognition=rec;rec.lang='en-US';rec.interimResults=false;rec.continuous=false;rec.onresult=e=>{const text=Array.from(e.results).map(r=>r[0].transcript).join(' ').trim();if(text)deliver(people[0],text)};rec.onerror=e=>status('Microphone: '+e.error+'. You can also dictate into the text field.');rec.onend=()=>{recognition=null;const t=document.querySelector('#talk');if(t){t.textContent='🎙 Talk to Nova';t.classList.remove('listening')}};rec.start();status('Listening… speak now');const t=document.querySelector('#talk');if(t){t.textContent='🔴 Listening…';t.classList.add('listening')}}catch(e){recognition=null;status('Microphone could not start: '+e.message)}}
function render(){ $('#app').innerHTML=active?conversation(people.find(p=>p.id===active)):(tab==='home'?home():tab==='inbox'?inbox():tab==='gallery'?gallery():settings());document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',!active&&b.dataset.tab===tab));document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{active=b.dataset.person;render();window.scrollTo(0,0)});if($('#back'))$('#back').onclick=()=>{active=null;render()};if($('#compose'))$('#compose').onsubmit=e=>{e.preventDefault();const inp=$('#msg'),v=inp.value.trim();if(!v)return;const p=people.find(p=>p.id===active);deliver(p,v)};if($('#talk'))$('#talk').onclick=startListening;if($('#stopVoice'))$('#stopVoice').onclick=()=>{if(recognition)recognition.abort();if('speechSynthesis'in window)speechSynthesis.cancel();status('Voice stopped')};if($('#endpoint'))$('#endpoint').onchange=e=>{data.settings.endpoint=e.target.value.trim();save()};if($('#access'))$('#access').onchange=e=>{data.settings.access=e.target.value;save()};if($('#autoSpeak'))$('#autoSpeak').onchange=e=>{data.settings.autoSpeak=e.target.checked;save()};if($('#checkins'))$('#checkins').onchange=e=>{data.settings.checkins=e.target.checked;save()};if($('#previews'))$('#previews').onchange=e=>{data.settings.previews=e.target.checked;save()};if($('#erase'))$('#erase').onclick=()=>{if(confirm('Erase all demo conversations on this device?')){data.chats={};save();render()}}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=null;tab=b.dataset.tab;render();window.scrollTo(0,0)});$('#topSettings').onclick=()=>{active=null;tab='settings';render()};render();
</script></body></html>
